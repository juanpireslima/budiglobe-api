
services:
  budiglobe-api-dev:
    build:
      context: .
      dockerfile: Dockerfile-dev
    ports:
      - "3000:3000"
    image: budiglobe-api-dev
    container_name: budiglobe-api-dev
    volumes:
      - .:/app
    environment:
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DATABASE=budiglobe-dev
      - POSTGRES_HOST=postgres-dev
      - POSTGRES_PORT=5432
      - STAGE=dev
      - PORT=3000
    depends_on:
      - postgres-dev
  
  budiglobe-api-debug:
      build:
        context: .
        dockerfile: Dockerfile-debug
      ports:
        - "3000:3000"
      image: budiglobe-api-debug
      container_name: budiglobe-api-debug
      volumes:
        - .:/app
      environment:
        - POSTGRES_USERNAME=postgres
        - POSTGRES_PASSWORD=postgres
        - POSTGRES_DATABASE=budiglobe-debug
        - POSTGRES_HOST=postgres-debug
        - POSTGRES_PORT=5432
        - STAGE=debug
        - PORT=3000
      depends_on:
        - postgres-debug
    
  budiglobe-api:
      build:
        context: .
        dockerfile: Dockerfile-prod
      ports:
        - "3000:3000"
      image: budiglobe-api
      container_name: budiglobe-api
      environment:
        - POSTGRES_USERNAME=postgres
        - POSTGRES_PASSWORD=postgres
        - POSTGRES_DATABASE=budiglobe
        - POSTGRES_HOST=postgres
        - POSTGRES_PORT=5432
        - STAGE=prod
        - PORT=3000
      depends_on:
            - postgres

  # Postgres
  postgres-dev:
    image: postgres:15.3
    container_name: budiglobe-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: budiglobe-dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

  postgres-debug:
    image: postgres:15.3
    container_name: budiglobe-postgres-debug
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: budiglobe-debug
    volumes:
      - postgres_data_debug:/var/lib/postgresql/data
    
  postgres:
    image: postgres:15.3
    container_name: budiglobe-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: budiglobe
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data_dev:
  postgres_data_debug:
  postgres_data: